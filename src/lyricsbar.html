<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Harle Player — Letra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500&family=DM+Serif+Display&family=Inter:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: 120, 170, 255; --dur: 3s; --from: 0%; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 14px; text-align: center; font-family: "Inter", "Segoe UI", sans-serif; }
    #line {
      max-width: 100%; padding: 0 24px; font-size: 44px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      /* "karaokê": a cor de destaque vai varrendo o verso da esquerda pra direita */
      background: linear-gradient(90deg, #fff 0 50%, rgba(255,255,255,.55) 50% 100%);
      background-size: 200% 100%; background-position: 100% 0;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.85)) drop-shadow(0 0 14px rgba(0,0,0,.55));
      transition: opacity .25s;
    }
    #line.sweep { animation: sweep var(--dur) linear forwards; }
    body.paused #line.sweep { animation-play-state: paused; }
    @keyframes sweep { from { background-position: var(--from) 0; } to { background-position: 0% 0; } }
    #next { margin-top: 6px; font-size: 20px; font-weight: 700; color: rgba(255,255,255,.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 24px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.9)); }
    body.font-serif #line, body.font-serif #next { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; letter-spacing: 0; }
    body.font-condensed #line, body.font-condensed #next { font-family: "Big Shoulders Display", "Inter", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; }
    body.font-condensed #line { font-size: 52px; }
    body.empty #line, body.empty #next { opacity: 0; }
  </style>
</head>
<body class="empty">
  <div id="line"></div>
  <div id="next"></div>
<script>
  const T = window.__TAURI__;
  const $ = (s) => document.querySelector(s);
  function show(p) {
    if (!p) return;
    document.body.className = "";
    if (p.font) document.body.classList.add(`font-${p.font}`);
    if (!p.text) document.body.classList.add("empty");
    if (!p.playing) document.body.classList.add("paused");
    const line = $("#line");
    if (line.textContent !== (p.text || "") || p.restart) {
      line.textContent = p.text || "";
      $("#next").textContent = p.next || "";
      // tempo que falta no verso → duração da varrida; o que já passou → onde ela começa
      const len = Math.max(400, (p.end || p.start + 3000) - p.start);
      const done = Math.min(1, Math.max(0, (p.pos - p.start) / len));
      line.style.setProperty("--dur", `${Math.max(0.2, (len * (1 - done)) / 1000)}s`);
      line.style.setProperty("--from", `${100 - done * 100}%`);
      line.classList.remove("sweep");
      void line.offsetWidth;
      line.classList.add("sweep");
    }
  }
  if (T) T.event.listen("hp-lyric", (e) => show(e.payload));
  else show({ text: "City lights are melting in the rain", next: "Neon signs spelling out your name", start: 0, end: 4000, pos: 1200, playing: true, font: "sans" });
</script>
</body>
</html>
