<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harle Player — Mini</title>
  <link rel="stylesheet" href="mini.css" />
</head>
<body>
  <div id="card" data-tauri-drag-region>
    <div id="bgArt" data-tauri-drag-region></div>
    <img id="cover" alt="" draggable="false" data-tauri-drag-region />
    <div class="info" data-tauri-drag-region>
      <div id="title" data-tauri-drag-region>Nada tocando</div>
      <div id="artist" data-tauri-drag-region>Harle Player</div>
      <div class="controls">
        <button id="prev" title="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5L9 12l10 7z" /></svg></button>
        <button id="play" class="play" title="Tocar/Pausar">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M7 4.5v15l13-7.5z" /></svg>
          <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z" /></svg>
        </button>
        <button id="next" title="Próxima"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z" /></svg></button>
        <span class="time" id="time">0:00</span>
      </div>
    </div>
    <div class="corner">
      <button id="expand" title="Abrir o Harle Player"><svg viewBox="0 0 12 12"><path d="M7 2h3v3M10 2 6.5 5.5M5 10H2V7M2 10l3.5-3.5" /></svg></button>
      <button id="close" title="Fechar mini player"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg></button>
    </div>
    <div class="bar"><div id="fill"></div></div>
  </div>
  <script type="module" src="mini.js"></script>
</body>
</html>
