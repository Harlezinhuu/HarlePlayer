<!doctype html>
<!--
  Player do YouTube do Harle Player.

  Desde nov/2026 o YouTube recusa (erro 152/153) o player embutido numa página
  de app (http://tauri.localhost): ele exige uma origem https de verdade. Esta
  página é servida PELO PRÓPRIO APP no endereço do GitHub do autor (o pedido é
  interceptado no WebView2, não sai do PC — ver src-tauri/src/ytembed.rs), e
  conversa com o app por postMessage.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Harle Player · YouTube</title>
<style>html,body{margin:0;background:#000;overflow:hidden}#p{width:100vw;height:100vh}</style>
</head>
<body>
<div id="p"></div>
<script>
(() => {
  // só o próprio app pode mandar comandos
  const APP = /^https?:\/\/tauri\.localhost$/;
  const ALLOWED = new Set(["loadVideoById", "playVideo", "pauseVideo", "stopVideo", "seekTo", "setVolume"]);
  let player = null, ready = false, appOrigin = null;

  const send = (m) => { if (appOrigin) parent.postMessage(Object.assign({ harleYt: 1 }, m), appOrigin); };
  const tick = () => {
    if (!ready) return;
    try { send({ type: "time", t: player.getCurrentTime() || 0, d: player.getDuration() || 0 }); } catch (e) {}
  };

  addEventListener("message", (e) => {
    if (e.source !== parent || !APP.test(e.origin)) return;
    const m = e.data;
    if (!m || m.harleYt !== 1) return;
    appOrigin = e.origin;
    if (m.type === "hello") { if (ready) send({ type: "ready" }); return; }
    if (m.type !== "cmd" || !ready || !ALLOWED.has(m.fn)) return;
    const args = Array.isArray(m.args) ? m.args.slice(0, 2) : [];
    if (m.fn === "loadVideoById" && !/^[\w-]{11}$/.test(String(args[0]))) return;
    try { player[m.fn].apply(player, args); } catch (err) {}
    tick();
  });

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player("p", {
      width: 200,
      height: 200,
      playerVars: { autoplay: 1, controls: 0, playsinline: 1, rel: 0, origin: location.origin },
      events: {
        onReady: () => { ready = true; send({ type: "ready" }); },
        onStateChange: (e) => { tick(); send({ type: "state", data: e.data }); },
        onError: (e) => send({ type: "error", data: e.data }),
      },
    });
    setInterval(tick, 250);
  };
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => send({ type: "fail" });
  document.head.appendChild(s);
})();
</script>
</body>
</html>
