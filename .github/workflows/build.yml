name: Build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de uma Release já criada (ex.: 0.1.0) pra anexar o instalador"
        required: false

permissions:
  contents: write

jobs:
  # Testes rápidos do front (funções puras, sem navegador)
  test-front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  # Testes do Rust (sem internet) no Windows de verdade
  test-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: cargo test
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --color never 2>&1 | tee cargo.txt
          status=${PIPESTATUS[0]}
          # erros de compilação aparecem como aviso na página do workflow (dá pra ler sem baixar o log)
          grep -aE "^(error|  -->|[0-9 ]+\|.*\^|test .* FAILED|thread .* panicked)" cargo.txt | head -60 |
            while IFS= read -r l; do echo "::notice::$l"; done
          exit $status

  windows:
    needs: [test-front, test-rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tag tem que ser igual à versão do código (senão o instalador sai com outro número
      # e o app fica achando que tem atualização pra sempre)
      - name: Conferir versão da tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"; tag="${tag#v}"
          ver=$(node -p "require('./package.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "::error::A tag é $tag, mas o código está na versão $ver. Apague a tag e crie $ver (ou suba a versão no código)."
            exit 1
          fi

      - name: Instalar dependências
        run: npm install

      # Em push normal só compila; em tag (ex.: v0.1.0) também cria a Release com o instalador.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # login do YouTube (Google Cloud): entram só no build, nunca no código
          HP_GOOGLE_CLIENT_ID: ${{ secrets.HP_GOOGLE_CLIENT_ID }}
          HP_GOOGLE_CLIENT_SECRET: ${{ secrets.HP_GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          releaseName: "Harle Player ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Baixe o instalador **Harle Player_x64-setup.exe** aqui embaixo em *Assets*."
          releaseDraft: false
          prerelease: false

      - name: Guardar o .exe como artifact
        uses: actions/upload-artifact@v4
        with:
          name: harle-player-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/harle-player.exe
