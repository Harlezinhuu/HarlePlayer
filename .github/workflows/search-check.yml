name: Busca ao vivo

# Faz uma busca de verdade no SoundCloud e no YouTube Music.
# Como as APIs não são oficiais, roda todo dia: se um dos sites mudar,
# o selo fica vermelho antes de alguém reclamar.
on:
  schedule:
    - cron: "17 11 * * *" # todo dia, 08:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src-tauri/src/search.rs"]

jobs:
  live-search:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Buscar no SoundCloud e no YouTube Music
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml ao_vivo -- --ignored --nocapture --test-threads=1 2>&1 | tee resultado.txt

      # Mostra o resultado como avisos na página do workflow (dá pra ler sem baixar o log)
      - name: Resumo
        if: always()
        shell: bash
        run: |
          grep -aE "^test |SoundCloud:|YouTube Music:|áudio de|não tocou|panicked|left:|right:|falhou" resultado.txt | head -40 |
            while IFS= read -r l; do echo "::notice::$l"; done
